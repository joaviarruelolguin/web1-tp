<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotiTech - Contacto</title>
  <meta name="description" content="Contacta con el equipo de NotiTech">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header class="encabezado-sitio">
    <nav class="barra-navegacion" aria-label="Navegación principal">
      <a href="index.html" class="logo-navegacion">Noti<span>Tech</span></a>
      <ul class="menu-navegacion">
        <li><a href="index.html" class="enlace-navegacion">Inicio</a></li>
        <li><a href="noticias.html" class="enlace-navegacion">Noticias</a></li>
        <li><a href="contacto.html" class="enlace-navegacion activa" aria-current="page">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="contenido-principal">
    <h1 class="titulo-seccion">Contacto</h1>
    <p class="descripcion-seccion">¿Tienes alguna pregunta o sugerencia? Completa el formulario y nos pondremos en
      contacto contigo.</p>

    <section class="seccion-formulario">
      <form id="formulario-contacto" class="formulario-contacto" novalidate>
        <div class="grupo-formulario">
          <label for="nombre">Nombre completo <span class="obligatorio">*</span></label>
          <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required minlength="3"
            maxlength="50">
          <span class="mensaje-error" id="error-nombre" role="alert"></span>
        </div>

        <div class="grupo-formulario">
          <label for="email">Correo electrónico <span class="obligatorio">*</span></label>
          <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
          <span class="mensaje-error" id="error-email" role="alert"></span>
        </div>

        <div class="grupo-formulario">
          <label for="telefono">Teléfono <span class="obligatorio">*</span></label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej: 11 1234-5678" required>
          <span class="mensaje-error" id="error-telefono" role="alert"></span>
        </div>

        <div class="grupo-formulario">
          <label for="asunto">Asunto</label>
          <select id="asunto" name="asunto">
            <option value="general">Consulta general</option>
            <option value="suscripcion">Suscripción</option>
            <option value="publicidad">Publicidad</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="grupo-formulario">
          <label for="mensaje">Mensaje <span class="obligatorio">*</span></label>
          <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required
            minlength="10" maxlength="500"></textarea>
          <span class="mensaje-error" id="error-mensaje" role="alert"></span>
        </div>

        <button type="submit" class="boton-enviar">Enviar mensaje</button>
      </form>
    </section>

  </main>

  <footer class="pie-sitio">
    <p>&copy; 2026 NotiTech. Todos los derechos reservados.</p>
  </footer>

</body>

</html>
